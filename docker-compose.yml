services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PASSWORD: change-me
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: catalog_maker
      MYSQL_ROOT_PASSWORD: change-me
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pchange-me --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
